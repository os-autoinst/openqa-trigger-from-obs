---
name: CI

on: [pull_request, workflow_dispatch]  # yamllint disable-line rule:truthy

permissions:
  contents: read

env:
  CI_SERVICED_IMAGE: registry.opensuse.org/home/szarate/branches/devel/openqa/ci/containers16.0/serviced:latest

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: integration
        run: |
          podman pull ${CI_SERVICED_IMAGE}
          make test_docker PRIVILEGED_TESTS=1
      - name: Hack reminder
        if: ${{  contains(env.CI_SERVICED_IMAGE, 'home') }}
        run: echo "::error file=.github/workflows/integration.yaml,line=10::This is a hack and must be restored to use devel:openQA:ci serviced"
